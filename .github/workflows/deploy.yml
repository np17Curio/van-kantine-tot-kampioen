# Zet het spel op GitHub Pages: bij elke push naar main bouwt GitHub het spel (npm run build) en zet de map dist online.
# Eenmalig nodig op GitHub: Settings → Pages → Source: "GitHub Actions".
# Het spel staat daarna op https://np17curio.github.io/van-kantine-tot-kampioen/
name: Deploy naar GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # (ook met de hand te starten, onder het tabblad Actions)

permissions:
  contents: read
  pages: write
  id-token: write

# Nooit twee uitrollen tegelijk; een nieuwe push wacht tot de vorige klaar is
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
